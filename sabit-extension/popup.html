<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sabit's API Builder</title>
  <style>
    body { width: 300px; padding: 16px; font-family: Arial, sans-serif; }
    h2 { color: #667eea; margin: 0 0 8px 0; }
    #credits { background: #edf2f7; padding: 8px 12px; border-radius: 20px; font-weight: bold; }
    .api-item { background: white; padding: 10px; margin: 8px 0; border-radius: 8px; border-left: 4px solid #667eea; }
    .api-name { font-weight: bold; }
    .api-desc { font-size: 12px; color: #718096; }
    button { background: #48bb78; color: white; border: none; padding: 6px 16px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>⚡ Sabit's API Builder</h2>
  <div id="credits">Loading credits...</div>
  <hr>
  <div id="api-list">
    <h3>Your APIs</h3>
    <ul id="apis"></ul>
  </div>
  <button id="refresh-btn">🔄 Refresh</button>
  <script src="popup.js"></script>
</body>
</html>
